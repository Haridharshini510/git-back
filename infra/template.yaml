AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GitBack - Persistent development memory for coding agents

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref GitBackTable
        GITBACK_AWS_REGION: !Ref AWS::Region

Parameters:
  Stage:
    Type: String
    Default: dev

Resources:

  # --- Data Layer ---

  GitBackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claude-code-gitback-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # --- API Layer ---

  GitBackApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"

  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.listProjectsHandler
      CodeUri: src/
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref GitBackApi
            Path: /projects
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GitBackTable

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getProjectHandler
      CodeUri: src/
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref GitBackApi
            Path: /projects/{projectId}
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GitBackTable

  ListCheckpointsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.listCheckpointsHandler
      CodeUri: src/
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref GitBackApi
            Path: /projects/{projectId}/checkpoints
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GitBackTable

  # --- Frontend Hosting ---

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub claude-code-gitback-frontend-${Stage}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  # --- Stale Project Detection (production) ---

  StaleCheckRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'rate(1 day)'
      State: DISABLED
      Targets:
        - Arn: !GetAtt StaleCheckFunction.Arn
          Id: StaleCheckTarget

  StaleCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.staleCheckHandler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GitBackTable
        - SNSPublishMessagePolicy:
            TopicArn: !Ref AlertTopic

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub gitback-alerts-${Stage}

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${GitBackApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Description: Frontend S3 website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
  TableName:
    Description: DynamoDB table name
    Value: !Ref GitBackTable
  AlertTopicArn:
    Description: SNS topic for stale project alerts
    Value: !Ref AlertTopic
